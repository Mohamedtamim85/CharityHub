services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: charityhub
      POSTGRES_PASSWORD: charityhub
      POSTGRES_DB: charityhub
    ports:
      - "5432:5432"
    volumes:
      - charityhub_pgdata:/var/lib/postgresql/data

volumes:
  charityhub_pgdata:
